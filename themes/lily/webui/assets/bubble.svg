<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="body" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#f3e8ff" stop-opacity="0.18"/>
      <stop offset="82%" stop-color="#d8b4fe" stop-opacity="0.45"/>
      <stop offset="96%" stop-color="#bae6fd" stop-opacity="0.6"/>
